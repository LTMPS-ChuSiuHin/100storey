<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常識問答比賽 | 互動挑戰系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a0ca3;
            --secondary: #4cc9f0;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-main: #2b2d42;
            --text-light: #8d99ae;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        /* 主容器：限制最大寬度並加入玻璃擬物化風格 */
        .app-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 600px;
        }

        /* 頁面切換控制 */
        .screen {
            display: none;
            padding: 40px;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 共用標題 */
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* ===== 主選單 ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .menu-card {
            background: var(--surface);
            border: 2px solid #eef2f6;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 10px 20px rgba(76, 201, 240, 0.2);
        }
        .menu-card i { font-size: 48px; color: var(--primary); margin-bottom: 15px; }
        .menu-card h3 { font-size: 22px; font-weight: 700; }

        /* ===== 登入與表單 ===== */
        .form-container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-light); }
        .form-control {
            width: 100%; padding: 12px 16px; font-size: 16px;
            border: 2px solid #eef2f6; border-radius: 12px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary); }
        
        .btn {
            width: 100%; padding: 15px; font-size: 18px; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: var(--text-light); border: 2px solid #eef2f6; margin-top: 15px;}
        .btn-outline:hover { background: #f8f9fa; color: var(--text-main); }

        /* ===== 測驗介面 ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: #eef2f6; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 16px; }
        .badge.score-badge { background: var(--warning); color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        
        .timer-container { height: 16px; background: #eef2f6; border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
        .timer-bar { height: 100%; width: 100%; background: var(--success); transition: width 0.1s linear, background-color 0.3s; }

        .question-text { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 30px; min-height: 70px;}
        
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .option-btn {
            background: var(--surface); border: 4px solid #eef2f6; border-radius: 16px;
            padding: 5px; cursor: pointer; transition: all 0.2s; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .option-btn:hover { border-color: var(--secondary); transform: scale(1.02); }
        .option-btn img { width: 100%; border-radius: 8px; display: block; aspect-ratio: 16/9; object-fit: cover; }

        /* ===== 排行榜 ===== */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-bar select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .table-container { max-height: 400px; overflow-y: auto; border-radius: 12px; border: 1px solid #eef2f6; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: var(--primary); color: white; padding: 12px; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #eef2f6; }
        tr:nth-child(even) { background: #f8f9fa; }
        .rank-icon { font-size: 20px; }
        .rank-1 { color: #f1c40f; } .rank-2 { color: #bdc3c7; } .rank-3 { color: #cd7f32; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="menu-screen" class="screen active">
        <h1 class="title"><i class="fa-solid fa-graduation-cap"></i> 常識問答挑戰賽</h1>
        <div class="menu-grid">
            <div class="menu-card" onclick="openLogin('1-2')">
                <i class="fa-solid fa-seedling"></i>
                <h3>一、二年級</h3>
                <p style="color:var(--text-light);font-size:14px;margin-top:10px;">初級挑戰</p>
            </div>
            <div class="menu-card" onclick="openLogin('3-4')">
                <i class="fa-solid fa-tree"></i>
                <h3>三、四年級</h3>
                <p style="color:var(--text-light);font-size:14px;margin-top:10px;">中級挑戰</p>
            </div>
            <div class="menu-card" onclick="openLogin('5-6')">
                <i class="fa-solid fa-mountain"></i>
                <h3>五、六年級</h3>
                <p style="color:var(--text-light);font-size:14px;margin-top:10px;">高級挑戰</p>
            </div>
            <div class="menu-card" onclick="openLeaderboard()">
                <i class="fa-solid fa-trophy"></i>
                <h3>排行榜</h3>
                <p style="color:var(--text-light);font-size:14px;margin-top:10px;">查看最高榮譽</p>
            </div>
        </div>
    </div>

    <div id="login-screen" class="screen">
        <h1 class="title" id="login-title">準備作答</h1>
        <div class="form-container">
            <div class="form-group">
                <label>年級：</label>
                <select id="grade-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>班別：</label>
                <select id="class-select" class="form-control">
                    <option value="A">A班</option>
                    <option value="B">B班</option>
                    <option value="C">C班</option>
                    <option value="D">D班</option>
                    <option value="E">E班</option>
                </select>
            </div>
            <div class="form-group">
                <label>學號 (1-36)：</label>
                <input type="number" id="student-num" class="form-control" min="1" max="36" placeholder="請輸入學號" required>
            </div>
            <button class="btn btn-primary" onclick="startQuiz()"><i class="fa-solid fa-play"></i> 開始作答</button>
            <button class="btn btn-outline" onclick="showScreen('menu-screen')"><i class="fa-solid fa-arrow-left"></i> 返回主選單</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="top-bar">
            <div class="badge" id="question-counter">第 1 / 10 題</div>
            <div class="badge score-badge" id="score-display"><i class="fa-solid fa-star"></i> 0 分</div>
        </div>
        <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
        
        <div class="question-text" id="question-text">題目載入中...</div>
        
        <div class="options-grid">
            <button class="option-btn" data-opt="A"><img id="img-A" src="" alt="A"></button>
            <button class="option-btn" data-opt="B"><img id="img-B" src="" alt="B"></button>
            <button class="option-btn" data-opt="C"><img id="img-C" src="" alt="C"></button>
            <button class="option-btn" data-opt="D"><img id="img-D" src="" alt="D"></button>
        </div>
        <div style="text-align:center; margin-top: 20px;">
             <button class="btn btn-outline" style="width: auto; padding: 10px 20px;" onclick="abortQuiz()">放棄作答</button>
        </div>
    </div>

    <div id="result-screen" class="screen" style="text-align: center;">
        <i class="fa-solid fa-medal" style="font-size: 80px; color: var(--warning); margin-bottom: 20px;"></i>
        <h1 class="title">挑戰完成！</h1>
        <h2 style="font-size: 36px; margin-bottom: 20px; font-family: 'Nunito', sans-serif;" id="final-score">總分: 0</h2>
        <p id="upload-status" style="font-size: 18px; font-weight: 700; margin-bottom: 30px; min-height: 27px;"></p>
        <div class="form-container">
            <button class="btn btn-primary" onclick="showScreen('menu-screen')"><i class="fa-solid fa-house"></i> 返回首頁</button>
            <button class="btn btn-outline" onclick="openLeaderboard()"><i class="fa-solid fa-list-ol"></i> 查看排行榜</button>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen">
        <h1 class="title"><i class="fa-solid fa-trophy"></i> 排行榜</h1>
        <div class="filter-bar">
            <select id="filter-group" onchange="renderLeaderboard()">
                <option value="ALL">所有組別</option>
                <option value="1-2">一、二年級</option>
                <option value="3-4">三、四年級</option>
                <option value="5-6">五、六年級</option>
            </select>
            <select id="filter-grade" onchange="renderLeaderboard()">
                <option value="ALL">所有年級</option>
                <option value="1">1年級</option><option value="2">2年級</option>
                <option value="3">3年級</option><option value="4">4年級</option>
                <option value="5">5年級</option><option value="6">6年級</option>
            </select>
            <select id="filter-class" onchange="renderLeaderboard()">
                <option value="ALL">所有班別</option>
                <option value="A">A班</option><option value="B">B班</option>
                <option value="C">C班</option><option value="D">D班</option><option value="E">E班</option>
            </select>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>排名</th><th>年級</th><th>班別</th><th>學號</th><th>分數</th></tr>
                </thead>
                <tbody id="leaderboard-body">
                    </tbody>
            </table>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-outline" style="width: auto; padding: 10px 30px;" onclick="showScreen('menu-screen')"><i class="fa-solid fa-arrow-left"></i> 返回</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBr0-oNmRN859g6bfGDVjSdA1brJC8CxNs",
      authDomain: "ltmps-c92a0.firebaseapp.com",
      projectId: "ltmps-c92a0",
      storageBucket: "ltmps-c92a0.firebasestorage.app",
      messagingSenderId: "716255242034",
      appId: "1:716255242034:web:b25a037869d8a9de6f992b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 題庫資料 ---
    const questionBanks = {
        "1-2": [], // 待提供
        "3-4": [
            { id: 1, text: "小土正用工具幫動物治療，而樓層的數字是單數。", answer: "B" },
            { id: 2, text: "這一層的動物正在一起看電視", answer: "D" },
            { id: 3, text: "這一層的動物正在洗澡，而這一層有鏡子。", answer: "C" },
            { id: 4, text: "這一層的動物正在煮飯，而這個樓層的號碼有「4」。", answer: "A" },
            { id: 5, text: "哪一層是這裏第三高的？", answer: "B" },
            { id: 6, text: "這一層的動物數量是單數。", answer: "D" },
            { id: 7, text: "這一層的動物正在看書，不過不是坐在椅子上的。", answer: "C" },
            { id: 8, text: "這一層的動物正在用餐具進食，而這個樓層的號碼有「3」。", answer: "B" },
            { id: 9, text: "哪一層是這裏第四高的？", answer: "C" },
            { id: 10, text: "這一層的動物正在慶祝生日。", answer: "A" }
        ],
        "5-6": [] // 待提供
    };

    // --- 全局狀態變數 ---
    let currentGroup = "";
    let currentQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let timeLeft = 10;
    let timerInterval;
    let studentData = { grade: '', class: '', num: '' };
    let allLeaderboardData = []; // 緩存排行榜資料

    // --- 畫面切換控制 ---
    window.showScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    };

    // --- 開啟登入頁面並動態生成年級選項 ---
    window.openLogin = function(group) {
        currentGroup = group;
        document.getElementById('login-title').innerHTML = `<i class="fa-solid fa-user-astronaut"></i> ${group}年級 登入`;
        
        const gradeSelect = document.getElementById('grade-select');
        gradeSelect.innerHTML = ''; // 清空選項

        let options = [];
        if(group === '1-2') options = [1, 2];
        if(group === '3-4') options = [3, 4];
        if(group === '5-6') options = [5, 6];

        options.forEach(grade => {
            const opt = document.createElement('option');
            opt.value = grade;
            opt.text = `${grade}年級`;
            gradeSelect.appendChild(opt);
        });

        document.getElementById('student-num').value = ''; // 清空學號
        showScreen('login-screen');
    };

    // --- 洗牌演算法 ---
    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // --- 開始作答 ---
    window.startQuiz = function() {
        studentData.grade = document.getElementById('grade-select').value;
        studentData.class = document.getElementById('class-select').value;
        studentData.num = document.getElementById('student-num').value;

        if (!studentData.num || studentData.num < 1 || studentData.num > 36) {
            alert("請輸入正確的學號 (1-36)！");
            return;
        }

        if (questionBanks[currentGroup].length === 0) {
            alert(`目前 ${currentGroup} 年級的題目尚未開放！`);
            return;
        }

        currentQuestions = shuffle(questionBanks[currentGroup]);
        currentQIndex = 0;
        score = 0;
        document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star"></i> 0 分`;

        showScreen('quiz-screen');
        loadQuestion();
    };

    // --- 放棄作答 ---
    window.abortQuiz = function() {
        if(confirm("確定要放棄目前的測驗嗎？成績將不會被記錄。")) {
            clearInterval(timerInterval);
            showScreen('menu-screen');
        }
    };

    // --- 載入題目 ---
    function loadQuestion() {
        if (currentQIndex >= currentQuestions.length) {
            endQuiz();
            return;
        }

        const q = currentQuestions[currentQIndex];
        document.getElementById('question-counter').innerText = `第 ${currentQIndex + 1} / ${currentQuestions.length} 題`;
        
        // 加入淡入特效
        const qText = document.getElementById('question-text');
        qText.style.animation = 'none';
        qText.offsetHeight; /* 觸發重繪 */
        qText.style.animation = 'fadeIn 0.3s ease-out';
        qText.innerText = q.text;

        // 圖片檔名邏輯: P3-4_Q1_A.png (使用群組名稱作為 Prefix 配合你先前提供的格式)
        const prefix = `P${currentGroup}_Q${q.id}`;
        document.getElementById('img-A').src = `${prefix}_A.png`;
        document.getElementById('img-B').src = `${prefix}_B.png`;
        document.getElementById('img-C').src = `${prefix}_C.png`;
        document.getElementById('img-D').src = `${prefix}_D.png`;

        startTimer();
    }

    // --- 計時器 ---
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 10;
        const timerBar = document.getElementById('timer-bar');
        timerBar.style.width = '100%';
        timerBar.style.backgroundColor = 'var(--success)';

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            const percentage = (timeLeft / 10) * 100;
            timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 3) {
                timerBar.style.backgroundColor = 'var(--danger)'; // 最後3秒變紅
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkAnswer(null); // 超時
            }
        }, 100);
    }

    // --- 檢查答案 ---
    window.checkAnswer = function(selectedOpt) {
        clearInterval(timerInterval);
        const q = currentQuestions[currentQIndex];

        if (selectedOpt === q.answer) {
            const timeBonus = Math.floor((timeLeft / 10) * 500);
            score += (500 + Math.max(0, timeBonus)); 
            document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star"></i> ${score} 分`;
        }

        currentQIndex++;
        setTimeout(loadQuestion, 200); // 微停頓讓玩家感受到點擊
    };

    // 綁定選項點擊事件
    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            checkAnswer(this.getAttribute('data-opt'));
        });
    });

    // --- 結束測驗與上傳成績 ---
    async function endQuiz() {
        showScreen('result-screen');
        document.getElementById('final-score').innerText = `總分: ${score}`;
        
        const statusText = document.getElementById('upload-status');
        statusText.innerText = "正在上載成績至系統...";
        statusText.style.color = "var(--text-light)";

        // 確保每人只留第一次紀錄 (以 GradeX_ClassY_NumZ 命名文件)
        const docId = `Grade${studentData.grade}_Class${studentData.class}_Num${studentData.num}`;
        const docRef = doc(db, "quiz_scores", docId);

        try {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                statusText.innerHTML = "<i class='fa-solid fa-circle-exclamation'></i> 你已完成過測試，本次成績不作記錄。";
                statusText.style.color = "var(--warning)";
            } else {
                await setDoc(docRef, {
                    group: currentGroup,
                    grade: studentData.grade,
                    class: studentData.class,
                    studentNum: studentData.num,
                    score: score,
                    timestamp: new Date()
                });
                statusText.innerHTML = "<i class='fa-solid fa-circle-check'></i> 首次作答成績已成功上載！";
                statusText.style.color = "var(--success)";
            }
        } catch (error) {
            console.error("上傳失敗:", error);
            statusText.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> 網絡異常，上載失敗。";
            statusText.style.color = "var(--danger)";
        }
    }

    // --- 排行榜功能 ---
    window.openLeaderboard = async function() {
        showScreen('leaderboard-screen');
        document.getElementById('leaderboard-body').innerHTML = "<tr><td colspan='5'>資料載入中 <i class='fa-solid fa-spinner fa-spin'></i></td></tr>";
        
        try {
            const querySnapshot = await getDocs(collection(db, "quiz_scores"));
            allLeaderboardData = [];
            querySnapshot.forEach((doc) => {
                allLeaderboardData.push(doc.data());
            });
            renderLeaderboard();
        } catch (error) {
            console.error("排行榜載入失敗:", error);
            document.getElementById('leaderboard-body').innerHTML = "<tr><td colspan='5'>無法載入排行榜資料，請稍後再試。</td></tr>";
        }
    };

    window.renderLeaderboard = function() {
        const filterGroup = document.getElementById('filter-group').value;
        const filterGrade = document.getElementById('filter-grade').value;
        const filterClass = document.getElementById('filter-class').value;

        // 篩選資料
        let filtered = allLeaderboardData.filter(data => {
            let matchGroup = (filterGroup === 'ALL' || data.group === filterGroup);
            let matchGrade = (filterGrade === 'ALL' || data.grade === filterGrade);
            let matchClass = (filterClass === 'ALL' || data.class === filterClass);
            return matchGroup && matchGrade && matchClass;
        });

        // 依分數降冪排序
        filtered.sort((a, b) => b.score - a.score);

        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        if(filtered.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='color:#8d99ae;'>目前沒有符合條件的紀錄</td></tr>";
            return;
        }

        filtered.forEach((data, index) => {
            const rank = index + 1;
            let rankIcon = rank;
            if(rank === 1) rankIcon = `<i class="fa-solid fa-crown rank-icon rank-1"></i>`;
            if(rank === 2) rankIcon = `<i class="fa-solid fa-medal rank-icon rank-2"></i>`;
            if(rank === 3) rankIcon = `<i class="fa-solid fa-medal rank-icon rank-3"></i>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${rankIcon}</strong></td>
                <td>${data.grade}年級</td>
                <td>${data.class}班</td>
                <td>${data.studentNum}</td>
                <td style="color:var(--primary); font-weight:700;">${data.score}</td>
            `;
            tbody.appendChild(tr);
        });
    };
</script>

</body>
</html>
