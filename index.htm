<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100層樓眼明手快大挑戰</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF9800;       
            --primary-dark: #F57C00;
            --secondary: #00BCD4;     
            --success: #4CAF50;       
            --danger: #FF5252;        
            --bg-top: #4facfe;        
            --bg-bottom: #00f2fe;     
            --surface: #ffffff;
            --text-main: #37474F;
            --border-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 15px;
            overflow-x: hidden;
        }

        /* 遊戲主容器 */
        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border: 8px solid #FFF9C4;
            border-radius: 30px;
            box-shadow: 0 20px 0px rgba(0,0,0,0.1), inset 0 0 20px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
            min-height: 650px;
        }

        /* 頁面切換控制 */
        .screen { display: none; padding: 40px; }
        .screen.active { display: block; animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .title {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #FFF9C4, 4px 4px 0px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        .title i { color: var(--secondary); }

        /* ===== 主選單 ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 20px;
        }
        .menu-card {
            background: #FAFAFA;
            border: 4px solid #E0E0E0;
            border-radius: var(--border-radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .menu-card:hover {
            transform: translateY(-8px);
            border-color: var(--secondary);
            background: #E0F7FA;
            box-shadow: 0 10px 0px rgba(0, 188, 212, 0.2);
        }
        .menu-card:active { transform: translateY(0); box-shadow: 0 0px 0px transparent; }
        .menu-card i { font-size: 50px; color: var(--primary); margin-bottom: 15px; }
        .menu-card h3 { font-size: 26px; font-weight: 900; }

        /* ===== 表單與按鈕 ===== */
        .form-container { max-width: 450px; margin: 0 auto; background: #FAFAFA; padding: 30px; border-radius: 20px; border: 4px solid #EEEEEE; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 900; font-size: 18px; color: #546E7A; }
        .form-control {
            width: 100%; padding: 15px; font-size: 18px; font-weight: 700;
            border: 3px solid #CFD8DC; border-radius: 15px; outline: none;
            transition: 0.3s; background: #fff; color: #37474F;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 5px rgba(255, 152, 0, 0.2); }
        
        .btn {
            width: 100%; padding: 16px; font-size: 22px; font-weight: 900;
            border: none; border-radius: 15px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 8px 0px var(--primary-dark); margin-top: 10px; }
        .btn-primary:active { transform: translateY(8px); box-shadow: 0 0px 0px var(--primary-dark); }
        .btn-outline { background: #ECEFF1; color: #455A64; margin-top: 20px; box-shadow: 0 6px 0px #CFD8DC; }
        .btn-outline:active { transform: translateY(6px); box-shadow: 0 0px 0px transparent; }

        /* ===== 測驗介面 ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: #F3E5F5; color: #8E24AA; padding: 10px 20px; border-radius: 15px; font-weight: 900; font-size: 18px; border: 3px solid #E1BEE7; }
        .badge.score-badge { background: #FFF8E1; color: #FFA000; border-color: #FFECB3; font-size: 22px; font-family: 'Fredoka', sans-serif; }
        
        .timer-wrapper { position: relative; margin-bottom: 25px; }
        .timer-icon { position: absolute; left: -10px; top: -12px; font-size: 35px; z-index: 2; }
        .timer-container { height: 24px; background: #EEEEEE; border-radius: 12px; overflow: hidden; border: 3px solid #E0E0E0; margin-left: 15px; }
        .timer-bar { height: 100%; width: 100%; background: var(--success); transition: width 0.1s linear, background-color 0.3s; }

        .question-text { 
            font-size: 26px; font-weight: 900; text-align: center; 
            margin-bottom: 30px; min-height: 80px; line-height: 1.4;
            background: #E3F2FD; padding: 20px; border-radius: 20px; border: 3px solid #BBDEFB;
        }
        
        /* 選項動態排版 */
        .options-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; position: relative;}
        .option-btn {
            background: var(--surface); border: 5px solid #EEEEEE; border-radius: 20px;
            padding: 8px; cursor: pointer; transition: all 0.1s;
            box-shadow: 0 8px 0px #EEEEEE; flex: 1 1 calc(50% - 15px); max-width: calc(50% - 15px);
        }
        .options-grid.layout-6 .option-btn { flex: 1 1 calc(33.333% - 15px); max-width: calc(33.333% - 15px); }
        .option-btn:active { transform: translateY(8px); box-shadow: 0 0px 0px transparent; }
        .option-btn img { width: 100%; border-radius: 12px; display: block; aspect-ratio: 16/9; object-fit: cover; }
        
        .option-btn.selected-correct { border-color: var(--success) !important; box-shadow: 0 8px 0px #388E3C !important; background: #E8F5E9; }
        .option-btn.selected-wrong { border-color: var(--danger) !important; box-shadow: 0 8px 0px #D32F2F !important; background: #FFEBEE; }

        /* ===== 回饋特效覆蓋層 ===== */
        #feedback-overlay {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; padding: 30px 40px; border-radius: 25px;
            background: rgba(255, 255, 255, 0.95); box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 6px solid; width: 85%; max-width: 500px;
        }
        .feedback-correct { border-color: var(--success); color: var(--success); }
        .feedback-wrong { border-color: var(--danger); color: var(--danger); }
        .feedback-icon { font-size: 70px; margin-bottom: 5px; }
        .feedback-title { font-size: 32px; font-weight: 900; margin-bottom: 5px; }
        .feedback-score { font-size: 28px; font-weight: 900; font-family: 'Fredoka', sans-serif; color: #FFA000; }

        @keyframes popUp {
            0% { transform: translate(-50%, -40%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* ===== 排行榜設計 ===== */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn {
            padding: 12px 25px; border-radius: 20px; border: 3px solid #EEEEEE; background: #FAFAFA; 
            font-weight: 900; font-size: 18px; color: #757575; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary-dark); box-shadow: 0 4px 0px var(--primary-dark); }
        .tab-btn:hover:not(.active) { background: #E0F7FA; border-color: var(--secondary); color: var(--secondary); }
        
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; background: #FAFAFA; padding: 15px; border-radius: 20px; border: 3px solid #EEEEEE;}
        .filter-bar select { flex: 1; padding: 12px; border-radius: 12px; border: 3px solid #CFD8DC; font-weight: 700; color: #455A64; outline: none; transition: 0.2s;}
        .filter-bar select:focus { border-color: var(--secondary); }
        
        .lb-content-area { max-height: 400px; overflow-y: auto; border-radius: 15px; border: 3px solid #EEEEEE; background: #fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); padding-bottom: 10px;}
        .lb-group-title { background: #E0F7FA; color: #00838F; padding: 12px; text-align: center; font-weight: 900; margin: 15px 15px 0 15px; border-radius: 10px 10px 0 0; font-size: 20px;}
        
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 18px; }
        th { background: #E1F5FE; color: #0277BD; padding: 18px 10px; position: sticky; top: 0; font-weight: 900; letter-spacing: 1px; box-shadow: 0 2px 0px #B3E5FC;}
        td { padding: 15px 10px; border-bottom: 2px solid #F5F5F5; font-weight: 700; color: #37474F;}
        tr:nth-child(even) { background: #FAFAFA; }
        tr:hover { background: #F1F8E9; }
        .rank-icon { font-size: 24px; }
        .rank-1 { color: #FFC107; text-shadow: 0 2px 4px rgba(0,0,0,0.2); font-size: 32px; } 
        .rank-2 { color: #9E9E9E; font-size: 28px; } 
        .rank-3 { color: #FF7043; font-size: 26px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="menu-screen" class="screen active">
        <h1 class="title"><i class="fa-solid fa-building"></i> 100層樓眼明手快大挑戰</h1>
        <div class="menu-grid">
            <div class="menu-card" onclick="openLogin('1-2')">
                <i class="fa-solid fa-gamepad" style="color:#4CAF50;"></i>
                <h3>一、二年級</h3>
                <p style="color:#757575;font-weight:700;margin-top:10px;">初級探險</p>
            </div>
            <div class="menu-card" onclick="openLogin('3-4')">
                <i class="fa-solid fa-puzzle-piece" style="color:#FF9800;"></i>
                <h3>三、四年級</h3>
                <p style="color:#757575;font-weight:700;margin-top:10px;">中級挑戰</p>
            </div>
            <div class="menu-card" onclick="openLogin('5-6')">
                <i class="fa-solid fa-rocket" style="color:#E91E63;"></i>
                <h3>五、六年級</h3>
                <p style="color:#757575;font-weight:700;margin-top:10px;">終極任務</p>
            </div>
            <div class="menu-card" onclick="openLeaderboard()">
                <i class="fa-solid fa-trophy" style="color:#FFC107;"></i>
                <h3>排行榜</h3>
                <p style="color:#757575;font-weight:700;margin-top:10px;">查看最強王者</p>
            </div>
        </div>
    </div>

    <div id="login-screen" class="screen">
        <h1 class="title" id="login-title">準備進入大樓</h1>
        <div class="form-container">
            <div class="form-group">
                <label><i class="fa-solid fa-layer-group"></i> 年級：</label>
                <select id="grade-select" class="form-control"></select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-users"></i> 班別：</label>
                <select id="class-select" class="form-control">
                    <option value="A">A班</option><option value="B">B班</option>
                    <option value="C">C班</option><option value="D">D班</option><option value="E">E班</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-id-badge"></i> 學號 (1-36)：</label>
                <input type="number" id="student-num" class="form-control" min="1" max="36" placeholder="請輸入學號 (如: 1 或 01)" required>
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-cake-candles" style="color: #E91E63;"></i> 生日日期：</label>
                <div style="display: flex; gap: 10px;">
                    <select id="birth-month" class="form-control">
                        <option value="" disabled selected>請選擇月份</option>
                        </select>
                    <select id="birth-day" class="form-control">
                        <option value="" disabled selected>請選擇日期</option>
                        </select>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startQuiz()"><i class="fa-solid fa-play"></i> 進入挑戰！</button>
            <button class="btn btn-outline" onclick="showScreen('menu-screen')"><i class="fa-solid fa-arrow-left"></i> 回到大廳</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="top-bar">
            <div class="badge" id="question-counter"><i class="fa-solid fa-flag"></i> 第 1 / 10 關</div>
            <div class="badge score-badge" id="score-display"><i class="fa-solid fa-star"></i> 0 分</div>
        </div>
        
        <div class="timer-wrapper">
            <div class="timer-icon" id="timer-icon-anim">⏱️</div>
            <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
        </div>
        
        <div class="question-text" id="question-text">題目載入中...</div>
        <div class="options-grid" id="options-container"></div>
        <div id="feedback-overlay"><div id="feedback-content"></div></div>
    </div>

    <div id="result-screen" class="screen" style="text-align: center;">
        <i class="fa-solid fa-crown" style="font-size: 90px; color: #FFC107; margin-bottom: 20px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));"></i>
        <h1 class="title">挑戰完成！</h1>
        <div style="background: #FFF8E1; border: 4px solid #FFE082; padding: 20px; border-radius: 20px; display: inline-block; margin-bottom: 25px;">
            <h2 style="font-size: 42px; font-family: 'Fredoka', sans-serif; color: #F57C00;" id="final-score">總分: 0</h2>
        </div>
        <p id="upload-status" style="font-size: 20px; font-weight: 900; margin-bottom: 30px; min-height: 30px; line-height: 1.4;"></p>
        <div class="form-container" style="background: transparent; border: none; padding: 0;">
            <button class="btn btn-primary" onclick="showScreen('menu-screen')"><i class="fa-solid fa-house"></i> 返回大廳</button>
            <button class="btn btn-outline" onclick="openLeaderboard()"><i class="fa-solid fa-list-ol"></i> 查看排行榜</button>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen">
        <h1 class="title"><i class="fa-solid fa-trophy"></i> 排行榜</h1>
        
        <div class="tabs-container">
            <button class="tab-btn active" id="btn-tab-group" onclick="switchLeaderboardMode('group')">按組別</button>
            <button class="tab-btn" id="btn-tab-grade" onclick="switchLeaderboardMode('grade')">按級別</button>
            <button class="tab-btn" id="btn-tab-class" onclick="switchLeaderboardMode('class')">按班別</button>
        </div>

        <div class="filter-bar" id="lb-filters" style="display: none;"></div>
        <div id="lb-content" class="lb-content-area"></div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-outline" style="width: auto; padding: 12px 40px;" onclick="showScreen('menu-screen')"><i class="fa-solid fa-arrow-left"></i> 返回主選單</button>
        </div>
    </div>
</div>

    };

    // --- 題庫資料 ---

    let currentGroup = "";

    let studentData = { grade: '', class: '', num: '', month: '', day: '' };

    // --- 載入 JSON 資料 (預先加載) ---
    fetch('students.json')
        .then(response => response.json())
        .then(data => { studentDatabase = data; })
        .catch(error => { console.warn("尚未載入 students.json 或檔案不存在", error); });

    // --- 初始化生日選單 ---
    window.onload = function() {
        const monthSelect = document.getElementById('birth-month');
        const daySelect = document.getElementById('birth-day');
        
        for(let i = 1; i <= 12; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.text = `${i} 月`; monthSelect.add(opt);
        }

            let opt = document.createElement('option');
            opt.value = i; opt.text = `${i} 日`; daySelect.add(opt);
        }
    };

    window.showScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    };

            opt.value = grade; opt.text = `${grade}年級`; gradeSelect.appendChild(opt);
        });

        document.getElementById('student-num').value = ''; 
        document.getElementById('birth-month').value = ''; 
        document.getElementById('birth-day').value = ''; 
        showScreen('login-screen');
    };

    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    window.startQuiz = function() {
        studentData.grade = document.getElementById('grade-select').value;
        studentData.class = document.getElementById('class-select').value;
        studentData.month = document.getElementById('birth-month').value;
        studentData.day = document.getElementById('birth-day').value;
        
        let rawNum = document.getElementById('student-num').value;
        
        if (!rawNum || isNaN(rawNum)) {
            alert("請輸入正確的學號 (1-36)！"); return;
        }
        studentData.num = parseInt(rawNum, 10).toString();

        if (studentData.num < 1 || studentData.num > 36) {
            alert("學號必須介乎 1 到 36 之間！"); return;
        }
        
        if (!studentData.month || !studentData.day) {
            alert("請選擇正確的生日月份與日期！"); return;
        }

        currentQuestions = shuffle(questionBanks[currentGroup]);
        currentQIndex = 0;
        score = 0;
        document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star"></i> 0 分`;

        showScreen('quiz-screen');
        loadQuestion();
    };

    function loadQuestion() {
        if (currentQIndex >= currentQuestions.length) {
            endQuiz();
            return;
        }

        isAnswering = false; 
        const q = currentQuestions[currentQIndex];
        
        document.getElementById('question-counter').innerHTML = `<i class="fa-solid fa-flag"></i> 第 ${currentQIndex + 1} / 10 關`;
        document.getElementById('question-text').innerText = q.text;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        let availableOptions = currentGroup === '5-6' ? ['A', 'B', 'C', 'D', 'E', 'F'] : ['A', 'B', 'C', 'D'];
        optionsContainer.className = currentGroup === '5-6' ? 'options-grid layout-6' : 'options-grid';
        availableOptions = shuffle(availableOptions);

        availableOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.setAttribute('data-opt', opt);
            
            const img = document.createElement('img');
            img.src = `P${currentGroup}_Q${q.id}_${opt}.png`;
            img.alt = `選項 ${opt}`;
            
            btn.appendChild(img);
            btn.onclick = function() { checkAnswer(opt, this); };
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 15;
        const timerBar = document.getElementById('timer-bar');
        const timerIcon = document.getElementById('timer-icon-anim');
        
        timerBar.style.width = '100%';
        timerBar.style.backgroundColor = 'var(--success)';
        timerIcon.style.animation = 'none';

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            const percentage = (timeLeft / 15) * 100;
            timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 5) { 
                timerBar.style.backgroundColor = 'var(--danger)';
                timerIcon.style.animation = 'bounceIn 0.3s infinite alternate';
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkAnswer(null, null); 
            }
        }, 100);
    }

    window.checkAnswer = function(selectedOpt, btnElement) {
        if (isAnswering) return; 
        isAnswering = true;
        clearInterval(timerInterval);
        
        const q = currentQuestions[currentQIndex];
        const overlay = document.getElementById('feedback-overlay');
        const content = document.getElementById('feedback-content');
        let isCorrect = selectedOpt === q.answer;

        if (btnElement) {
            btnElement.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
            document.querySelectorAll('.option-btn').forEach(b => {
                if(b !== btnElement) b.style.opacity = '0.5';
            });
        }

        if (isCorrect) {
            const timeBonus = Math.floor((timeLeft / 15) * 500);
            const earned = 500 + Math.max(0, timeBonus);
            score += earned;
            
            document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star"></i> ${score} 分`;
            
            overlay.className = 'feedback-correct';
            content.innerHTML = `
                <div class="feedback-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="feedback-title">眼明手快！</div>
                <div class="feedback-score">+${earned} 分</div>
                <div style="width: 100%; height: 10px; background: #E8F5E9; border-radius: 5px; margin-top: 25px; overflow: hidden;">
                    <div id="fb-timer-bar" style="height: 100%; width: 100%; background: var(--success);"></div>
                </div>
            `;
            
            overlay.style.display = 'block';
            overlay.style.animation = 'popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            
            setTimeout(() => {
                const fbTimer = document.getElementById('fb-timer-bar');
                if(fbTimer) { fbTimer.style.transition = 'width 1.5s linear'; fbTimer.style.width = '0%'; }
            }, 50);

            setTimeout(() => { overlay.style.display = 'none'; currentQIndex++; loadQuestion(); }, 1500);

        } else {
            overlay.className = 'feedback-wrong';
            let msg = selectedOpt === null ? "時間到了！" : "哎呀，答錯了！";
            let correctImgSrc = `P${currentGroup}_Q${q.id}_${q.answer}.png`;
            
            content.innerHTML = `
                <div class="feedback-icon"><i class="fa-solid fa-circle-xmark"></i></div>
                <div class="feedback-title">${msg}</div>
                <div class="feedback-score" style="color:#757575; font-size:20px; margin-top:10px;">
                    正確的圖像是：<br>
                    <img src="${correctImgSrc}" alt="正確答案" style="width: 180px; max-width: 100%; border-radius: 12px; border: 4px solid #EEEEEE; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                </div>
                <div style="width: 100%; height: 10px; background: #FFEBEE; border-radius: 5px; margin-top: 25px; overflow: hidden;">
                    <div id="fb-timer-bar" style="height: 100%; width: 100%; background: var(--danger);"></div>
                </div>
            `;
            
            overlay.style.display = 'block';
            overlay.style.animation = 'popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            
            setTimeout(() => {
                const fbTimer = document.getElementById('fb-timer-bar');
                if(fbTimer) { fbTimer.style.transition = 'width 2.5s linear'; fbTimer.style.width = '0%'; }
            }, 50);

            setTimeout(() => { overlay.style.display = 'none'; currentQIndex++; loadQuestion(); }, 2500);
        }
    };

    async function endQuiz() {
        showScreen('result-screen');
        document.getElementById('final-score').innerText = `總分: ${score}`;
        const statusText = document.getElementById('upload-status');
        
        // --- 核對生日日期 ---
        // 尋找符合該 年級、班別、學號 的紀錄
        const studentRecord = studentDatabase.find(s => 
            String(s.grade) === studentData.grade && 
            String(s.class) === studentData.class && 
            String(s.num) === studentData.num
        );

        let isBirthdayCorrect = false;
        // 如果有這名學生，且輸入的月、日相符，才算正確
        if (studentRecord && String(studentRecord.month) === studentData.month && String(studentRecord.day) === studentData.day) {
            isBirthdayCorrect = true;
        }

        // 如果資料庫為空 (代表還沒放 JSON)，為了讓你方便測試，這段你可以自行決定是否要防呆。
        // 這裡設定：如果有讀到資料且生日錯誤，就阻擋。
        if (studentDatabase.length > 0 && !isBirthdayCorrect) {
            statusText.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> 由於生日日期輸入錯誤，這次的分數不會列入排行榜。";
            statusText.style.color = "#F44336"; // 紅色
            return; // 停止執行，不將資料上傳 Firebase
        }

        statusText.innerText = "正在傳送成績至指揮中心...";
        statusText.style.color = "#757575";

        const docId = `Grade${studentData.grade}_Class${studentData.class}_Num${studentData.num}`;
        const docRef = doc(db, "quiz_scores", docId);

        try {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                statusText.innerHTML = "<i class='fa-solid fa-circle-exclamation'></i> 只計算首次完成的分數，這次成績不會列入排行榜喔!";
                statusText.style.color = "#F57C00";
            } else {
                await setDoc(docRef, {
                    group: currentGroup,
                    grade: studentData.grade,
                    class: studentData.class,
                    studentNum: studentData.num,
                    score: score,
                    timestamp: new Date()
                });
                statusText.innerHTML = "<i class='fa-solid fa-circle-check'></i> 首次挑戰成績已成功記錄入排行榜！";
                statusText.style.color = "#4CAF50";
            }
        } catch (error) {
            console.error("上傳失敗:", error);
            statusText.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> 網絡異常，成績上傳失敗。";
            statusText.style.color = "#F44336";
        }
    }

    // --- 以下為排行榜的程式碼 (保持原樣) ---
    window.openLeaderboard = async function() {
        showScreen('leaderboard-screen');
        document.getElementById('lb-content').innerHTML = "<div style='text-align:center; padding:30px; font-size:18px;'>資料讀取中 <i class='fa-solid fa-spinner fa-spin'></i></div>";
        
        try {
            const querySnapshot = await getDocs(collection(db, "quiz_scores"));
            allLeaderboardData = [];
            querySnapshot.forEach((doc) => { allLeaderboardData.push(doc.data()); });
            switchLeaderboardMode('group');
        } catch (error) {
            console.error("排行榜載入失敗:", error);
            document.getElementById('lb-content').innerHTML = "<div style='text-align:center; padding:30px; color:#F44336;'>無法載入排行榜，請檢查網路連線。</div>";
        }
    };

    window.switchLeaderboardMode = function(mode) {
        lbMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-tab-${mode}`).classList.add('active');

        const filterBar = document.getElementById('lb-filters');
        
        if (mode === 'group') {
            filterBar.style.display = 'none';
            renderLeaderboard();
        } else if (mode === 'grade') {
            filterBar.style.display = 'flex';
            filterBar.innerHTML = `
                <select id="lb-grade-select" onchange="renderLeaderboard()">
                    <option value="1">1 年級</option><option value="2">2 年級</option>
                    <option value="3">3 年級</option><option value="4">4 年級</option>
                    <option value="5">5 年級</option><option value="6">6 年級</option>
                </select>
            `;
            renderLeaderboard();
        } else if (mode === 'class') {
            filterBar.style.display = 'flex';
            filterBar.innerHTML = `
                <select id="lb-grade-select" onchange="renderLeaderboard()">
                    <option value="1">1 年級</option><option value="2">2 年級</option>
                    <option value="3">3 年級</option><option value="4">4 年級</option>
                    <option value="5">5 年級</option><option value="6">6 年級</option>
                </select>
                <select id="lb-class-select" onchange="renderLeaderboard()">
                    <option value="A">A 班</option><option value="B">B 班</option>
                    <option value="C">C 班</option><option value="D">D 班</option><option value="E">E 班</option>
                </select>
            `;
            renderLeaderboard();
        }
    };

    window.renderLeaderboard = function() {
        const container = document.getElementById('lb-content');
        container.innerHTML = ''; 

        if (lbMode === 'group') {
            const groups = ['1-2', '3-4', '5-6'];
            const titles = ['一、二年級', '三、四年級', '五、六年級'];
            groups.forEach((group, index) => {
                let filtered = allLeaderboardData.filter(d => d.group === group);
                filtered.sort((a, b) => b.score - a.score);
                filtered = filtered.slice(0, 10); 
                container.innerHTML += `<div class="lb-group-title"><i class="fa-solid fa-ranking-star"></i> ${titles[index]} (首 10 名)</div>`;
                container.innerHTML += buildTableHTML(filtered);
            });
        } else if (lbMode === 'grade') {
            const selectedGrade = document.getElementById('lb-grade-select').value;
            let filtered = allLeaderboardData.filter(d => d.grade === selectedGrade);
            filtered.sort((a, b) => b.score - a.score);
            container.innerHTML = buildTableHTML(filtered);
        } else if (lbMode === 'class') {
            const selectedGrade = document.getElementById('lb-grade-select').value;
            const selectedClass = document.getElementById('lb-class-select').value;
            let filtered = allLeaderboardData.filter(d => d.grade === selectedGrade && d.class === selectedClass);
            filtered.sort((a, b) => b.score - a.score);
            container.innerHTML = buildTableHTML(filtered);
        }
    };

    function buildTableHTML(dataArray) {
        if (dataArray.length === 0) return `<div style="text-align:center; padding: 25px; color:#9E9E9E; font-weight:700;">目前還沒有同學上榜喔！</div>`;
        
        let html = `<table><thead><tr><th>排名</th><th>年級</th><th>班別</th><th>學號</th><th>分數</th></tr></thead><tbody>`;
        dataArray.forEach((data, index) => {
            const rank = index + 1;
            let rankIcon = `<b>${rank}</b>`;
            if(rank === 1) rankIcon = `<i class="fa-solid fa-medal rank-icon rank-1"></i>`;
            if(rank === 2) rankIcon = `<i class="fa-solid fa-medal rank-icon rank-2"></i>`;
            if(rank === 3) rankIcon = `<i class="fa-solid fa-medal rank-icon rank-3"></i>`;
            html += `<tr><td>${rankIcon}</td><td>${data.grade} 年級</td><td>${data.class} 班</td><td>${data.studentNum} 號</td><td style="color:var(--primary-dark); font-weight:900; font-family:'Fredoka',sans-serif; font-size:22px;">${data.score}</td></tr>`;
        });
        html += `</tbody></table>`;
        return html;
    }
</script>
